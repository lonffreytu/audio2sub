name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            artifact: windows
          - platform: ubuntu-22.04
            args: ""
            artifact: linux
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            artifact: macos-aarch64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            artifact: macos-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev libxdo-dev libfuse2 pkg-config

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: apps/desktop
        run: npx tauri build ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/*/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/*/release/bundle/macos/*.app.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify bundles
        run: |
          set -e
          find release-assets -type f | sort
          test "$(find release-assets -type f -name '*.exe' | wc -l)" -ge 1
          test "$(find release-assets -type f -name '*.msi' | wc -l)" -ge 1
          test "$(find release-assets -type f -name '*aarch64.dmg' | wc -l)" -ge 1
          test "$(find release-assets -type f -name '*x64.dmg' | wc -l)" -ge 1
          test "$(find release-assets -type f -name '*.deb' | wc -l)" -ge 1
          test "$(find release-assets -type f -name '*.AppImage' | wc -l)" -ge 1

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Audio2Sub ${{ github.ref_name }}"
          body: |
            Audio2Sub ${{ github.ref_name }} 自动构建。

            - Windows: MSI / NSIS
            - macOS: DMG / APP
            - Linux: DEB / AppImage
          draft: true
          prerelease: false
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.dmg
            release-assets/**/*.app.tar.gz
            release-assets/**/*.deb
            release-assets/**/*.AppImage
