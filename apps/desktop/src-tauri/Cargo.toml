[package]
name = "audio2sub-desktop"
version = "0.2.0"
description = "Audio2Sub desktop application"
edition = "2021"
license = "MIT"

[lib]
name = "audio2sub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
audio2sub-core = { path = "../../../crates/core" }
chrono = "0.4"
dirs = "6"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[workspace]
